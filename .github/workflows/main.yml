name: CI
on: [push, pull_request]
jobs:
  build:
    name: Build
    runs-on: ${{ matrix.os }}
    container: ${{ matrix.container }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        include:
          - os: windows-latest
          - os: ubuntu-latest
            container: registry.gitlab.steamos.cloud/steamrt/sniper/sdk
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          path: ${{ github.event.repository.name }}
          submodules: recursive
          fetch-depth: 0

      - name: Checkout Metamod
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/metamod-source
          ref: master
          path: mmsource-2.0
          submodules: recursive

      - name: Checkout HL2SDK
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk
          ref: cs2
          path: hl2sdk-cs2

      - name: Checkout HL2SDK Manifests
        uses: actions/checkout@v4
        with:
          repository: alliedmodders/hl2sdk-manifests
          ref: master
          path: hl2sdk-manifests
# ------------ Windows ------------
      - name: Set up Python
        uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.11"

      - name: Install pip
        if: runner.os == 'Windows'
        shell: cmd
        run: curl https://bootstrap.pypa.io/pip/3.6/get-pip.py | python

      - name: Clone AMBuild
        uses: actions/checkout@v6
        if: runner.os == 'Windows'
        with:
          repository: alliedmodders/ambuild
          path: ./ambuild

      - name: Install AMBuild
        if: runner.os == 'Windows'
        run: |
          python -m pip install ./ambuild
# ------------ Linux ------------
      - name: Checkout AMBuild
        uses: actions/checkout@v4
        if: runner.os == 'Linux'
        with:
          repository: alliedmodders/ambuild
          path: ambuild

      - name: Install AMBuild
        if: runner.os == 'Linux'
        run: |
          cd ambuild && python setup.py install && cd ..
# -------------------------------

      - name: Install Clang 16
        if: matrix.os == 'ubuntu-latest'
        run: |
          apt update && apt install -y clang-16
          ln -sf /usr/bin/clang-16 /usr/bin/clang && ln -sf /usr/bin/clang++-16 /usr/bin/clang++

      - name: Build
        working-directory: ${{ github.event.repository.name }}
        shell: bash
        run: |
          mkdir build && cd build
          python ../configure.py --enable-optimize --symbol-files --sdks cs2 --hl2sdk-manifests hl2sdk-manifests
          ambuild

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ runner.os }}
          path: ${{ github.event.repository.name }}/build/package
